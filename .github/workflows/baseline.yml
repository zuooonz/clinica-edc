name: Clinica baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: maven:3.9.9-eclipse-temurin-11@sha256:8d3b35643e52d707b16a3e9b52698be1b75c2b45beb5d0e37d35e881f0a18ced
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: mvn --version
      - run: mvn -B -ntp -C -f tools/i18n-baseline/pom.xml clean test

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/verify_pdfbox_layout.py
      - run: mvn -B -ntp -C -f vendor/pdfbox2-layout/pom.xml generate-sources
      - run: python3 tools/verify_pdfbox_layout.py --generated vendor/pdfbox2-layout/target/generated-sources/pdfbox2
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/check_database_baseline.py

  package:
    runs-on: ubuntu-24.04
    container:
      image: maven:3.9.9-eclipse-temurin-11@sha256:8d3b35643e52d707b16a3e9b52698be1b75c2b45beb5d0e37d35e881f0a18ced
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: mvn --version
      # Parent POM currently skips legacy DB-dependent tests. This is a package
      # gate, not evidence that those tests passed. No dependency cache: verify
      # checksums from fresh downloads on every run.
      - run: mvn -B -ntp -C -pl core -am -DskipTests=false -Dtest=PdfBoxLayoutTest,TwoFactorServiceTest,TwoFactorCertificateTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false test
      - run: mvn -B -ntp -C package
      - run: test -s web/target/LibreClinica-web.war
